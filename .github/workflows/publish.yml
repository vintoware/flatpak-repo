name: Publish Flatpak repo

# App build repos push apps/<name>.json (version + bundle URL + sha256) with a
# deploy key; that push triggers this workflow, which imports new bundles into the
# signed OSTree repo and deploys it to GitHub Pages.

on:
  push:
    branches: [main]
    paths: ["apps/**", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends flatpak ostree

      - name: Build site
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          export SITE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          scripts/publish.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
