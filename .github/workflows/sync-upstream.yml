name: Sync upstream releases

# For apps whose upstream publishes its own Flatpak bundles (upstream/*.json): point
# apps/*.json at the latest stable release, commit, and start the publish workflow.
# Pushes made with GITHUB_TOKEN don't trigger other workflows, so publish.yml is
# dispatched explicitly.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends minisign

      - name: Update pointers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHANGES_FILE: ${{ runner.temp }}/changes
        run: scripts/sync-upstream.sh

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGES_FILE: ${{ runner.temp }}/changes
        run: |
          [ -s "$CHANGES_FILE" ] || { echo "nothing to update"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps
          git commit -q -F "$CHANGES_FILE"
          # App build repos push to main too; rebase onto whatever landed meanwhile.
          for i in 1 2 3 0; do
            [ "$i" != 0 ] || { echo "push failed" >&2; exit 1; }
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep 5
          done
          git log -1 --format=%s
          gh workflow run publish.yml --ref main
